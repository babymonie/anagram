services:
  hub:
    build: .
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - hub_data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/hub.db
      - HUB_NAME=BetterGram Local Hub
      - HUB_URL=http://localhost:8080
      - ADMIN_TOKEN=bettergram-local-admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hub_data:
